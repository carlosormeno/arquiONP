# EJEMPLO DE REFERENCIA — LIN-FE-ANG-001 sección 16.4 y LIN-K8S-001 sección 9.2
# Reemplazar `nombre-sistema` y la versión de imagen por los valores reales.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-nombre-sistema
  labels:
    app.kubernetes.io/name: frontend-nombre-sistema
    app.kubernetes.io/part-of: nombre-sistema
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: frontend
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-nombre-sistema
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend-nombre-sistema
        app.kubernetes.io/part-of: nombre-sistema
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/component: frontend
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: frontend-nombre-sistema
      containers:
        - name: frontend-nombre-sistema
          # Tag explícito e inmutable. `latest` está PROHIBIDO en QA y PROD
          # (LIN-K8S-001 sección 6.3 y anti-patrones de la sección 19).
          image: registry.gitlab.onp.gob.pe/aplicaciones/nombre-sistema/frontend-nombre-sistema:1.0.0
          imagePullPolicy: IfNotPresent
          # 8080, no 80: la imagen nginx-unprivileged corre como uid 101 y no
          # puede bindear puertos < 1024 (LIN-FE-ANG-001 sección 16.5).
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Controles obligatorios de LIN-K8S-001 sección 14.1
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # nginx escribe sus temporales en /tmp (ver nginx.conf del template).
          # Se monta un volumen; NO se desactiva readOnlyRootFilesystem.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
      terminationGracePeriodSeconds: 30
