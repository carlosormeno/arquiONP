stages:
  - validate
  - test
  - package
  - image

variables:
  MAVEN_CLI_OPTS: "-B -ntp"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  paths:
    - .m2/repository

validate:
  stage: validate
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn ${MAVEN_CLI_OPTS} validate
    - mvn ${MAVEN_CLI_OPTS} checkstyle:check

test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn ${MAVEN_CLI_OPTS} test
  artifacts:
    when: always
    paths:
      - target/surefire-reports/
      - target/site/jacoco/

package:
  stage: package
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn ${MAVEN_CLI_OPTS} verify
  artifacts:
    paths:
      - target/*.jar

image:
  stage: image
  image: docker:27
  services:
    - docker:27-dind
  rules:
    - if: '$CI_COMMIT_BRANCH'
  script:
    - docker build -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA} .

# La migración de esquema (Flyway sobre db/migration/, LIN-BD-ORA-001 §8.4) y la invocación del
# Job puntual (k8s/base/job.yaml, "kubectl create -f" con nombre generado, ver ese archivo) son
# pasos de un stage "pre-deploy" que este pipeline mínimo no incluye — agregarlos según el modelo
# real de despliegue del sistema (LIN-CICD-001).
