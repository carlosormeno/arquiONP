# Perfil de VARIANTE (no de ambiente) — se combina con dev/qa/prod, ej. SPRING_PROFILES_ACTIVE=prod,worker.
# Activa el servidor web embebido únicamente para que Actuator exponga las probes obligatorias
# de LIN-K8S-001 §11.1/§11.2 sobre el Deployment continuo (k8s/base/deployment.yaml). Este
# worker no tiene controladores REST de negocio: todo el tráfico HTTP de este puerto es Actuator.
spring:
  main:
    web-application-type: servlet

server:
  port: 8080

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
    prometheus:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
