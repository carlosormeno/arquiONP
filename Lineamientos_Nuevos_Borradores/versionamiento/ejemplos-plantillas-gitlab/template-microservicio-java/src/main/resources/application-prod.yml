management:
  otlp:
    tracing:
      endpoint: http://otel-collector.otel-prod.svc.cluster.local:4318/v1/traces
    logging:
      endpoint: http://otel-collector.otel-prod.svc.cluster.local:4318/v1/logs
  tracing:
    sampling:
      probability: 0.1

otel:
  resource:
    attributes: deployment.environment=production

app:
  environment: production
