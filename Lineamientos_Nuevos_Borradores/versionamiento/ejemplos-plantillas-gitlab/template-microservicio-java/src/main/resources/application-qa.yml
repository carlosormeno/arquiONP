management:
  otlp:
    tracing:
      endpoint: http://otel-collector.otel-qa.svc.cluster.local:4318/v1/traces
    logging:
      endpoint: http://otel-collector.otel-qa.svc.cluster.local:4318/v1/logs
  tracing:
    sampling:
      probability: 0.5

otel:
  resource:
    attributes: deployment.environment=qa

app:
  environment: qa
