# EJEMPLO DE REFERENCIA — LIN-VER-001 Anexo F / LIN-K8S-001 Anexo A
# Overlay para producción (rama master)

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Imagen certificada en QA — misma imagen, misma versión (LIN-K8S-001 sección 6.4)
# "name" es la ruta COMPLETA de imagen de k8s/base/deployment.yaml — ver nota en overlays/dev.
images:
  - name: registry.gitlab.onp.gob.pe/aplicaciones/nombre-microservicio/nombre-microservicio
    newTag: "1.0.0"   # debe coincidir con el tag certificado en QA

replicas:
  - name: nombre-microservicio
    count: 3

patchesStrategicMerge:
  - patch-profile-prod.yaml
