management.otlp.tracing.endpoint=http://otel-collector.otel-dev.svc.cluster.local:4318/v1/traces
management.otlp.logging.endpoint=http://otel-collector.otel-dev.svc.cluster.local:4318/v1/logs
management.tracing.sampling.probability=1.0
otel.resource.attributes=deployment.environment=development
app.environment=development

swagger.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html