# ═══════════════════════════════════════════════════════════════
# CONFIGURACIÓN BASE --- onp-test-telemetria
# ═══════════════════════════════════════════════════════════════
spring.application.name=onp-test-telemetria

# ═══════════════════════════════════════════════════════════════
# OBSERVABILIDAD --- OpenTelemetry
# ═══════════════════════════════════════════════════════════════
# Versión del servicio --- debe coincidir con el pom.xml
management.info.env.enabled=true
info.app.version=@project.version@
# Protocolo de exportación: HTTP (puerto 4318)
management.otlp.tracing.export.protocol=http/protobuf
management.endpoints.web.exposure.include=health,info,metrics,prometheus
