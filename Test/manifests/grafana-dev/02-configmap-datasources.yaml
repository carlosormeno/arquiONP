apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: grafana-dev
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus.prometheus-dev.svc.cluster.local:9090
        access: proxy
        isDefault: true
        jsonData:
          timeInterval: 15s

      - name: Jaeger
        type: jaeger
        uid: jaeger
        url: http://jaeger-onp-query.observabilidad-dev.svc.cluster.local:16686
        access: proxy

      - name: Elasticsearch
        type: elasticsearch
        uid: elasticsearch
        url: http://elasticsearch.elastic-dev.svc.cluster.local:9200
        access: proxy
        basicAuth: true
        basicAuthUser: ${GF_ES_USERNAME}
        secureJsonData:
          basicAuthPassword: ${GF_ES_PASSWORD}
        jsonData:
          index: onp-logs-*
          timeField: "@timestamp"
          esVersion: "8.0.0"
          logMessageField: message
          logLevelField: log.level