apiVersion: v1
kind: Service
metadata:
  name: jaeger-query-nodeport
  namespace: observabilidad-dev
  labels:
    app: jaeger
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: query
    app.kubernetes.io/instance: jaeger-onp
  ports:
    - port: 16686
      targetPort: 16686
      nodePort: 30686