apiVersion: jaegertracing.io/v1
kind: Jaeger
metadata:
  name: jaeger-onp
  namespace: observabilidad-dev
spec:
  strategy: production
  collector:
    image: jaegertracing/jaeger-collector:1.56.0
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
  query:
    image: jaegertracing/jaeger-query:1.56.0
    replicas: 1
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
  storage:
    type: elasticsearch
    secretName: jaeger-es-credentials
    dependencies:
      enabled: false
    options:
      es.server-urls: http://elasticsearch.elastic-dev.svc.cluster.local:9200
      es.version: "8"
      es.index-prefix: jaeger-onp
      es.num-shards: "1"
      es.num-replicas: "0"
      es.tls.enabled: "false"
      es.tls.skip-host-verify: "false"
