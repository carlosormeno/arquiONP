apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: otel-dev
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        limit_mib: 200
        spike_limit_mib: 50
        check_interval: 5s
      batch:
        timeout: 5s
        send_batch_size: 512

    exporters:
      otlp/jaeger:
        endpoint: jaeger-onp-collector.observabilidad-dev.svc.cluster.local:4317
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: onp
      elasticsearch:
        endpoints:
          - http://elasticsearch.elastic-dev.svc.cluster.local:9200
        logs_index: onp-logs-development
        auth:
          authenticator: basicauth/es
        mapping:
          mode: ecs

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      basicauth/es:
        client_auth:
          username: ${env:OTEL_ES_USERNAME}
          password: ${env:OTEL_ES_PASSWORD}

    service:
      extensions: [health_check, basicauth/es]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/jaeger]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [elasticsearch]