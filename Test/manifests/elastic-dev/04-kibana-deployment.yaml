apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: elastic-dev
  labels:
    app: kibana
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
        environment: dev
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.19.15
          ports:
            - name: http
              containerPort: 5601
          env:
            - name: KIBANA_SYSTEM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kibana-es-credentials
                  key: KIBANA_SYSTEM_PASSWORD
            - name: KIBANA_ENCRYPTION_KEY_1
              valueFrom:
                secretKeyRef:
                  name: kibana-encryption-keys
                  key: KIBANA_ENCRYPTION_KEY_1
            - name: KIBANA_ENCRYPTION_KEY_2
              valueFrom:
                secretKeyRef:
                  name: kibana-encryption-keys
                  key: KIBANA_ENCRYPTION_KEY_2
            - name: KIBANA_ENCRYPTION_KEY_3
              valueFrom:
                secretKeyRef:
                  name: kibana-encryption-keys
                  key: KIBANA_ENCRYPTION_KEY_3
          volumeMounts:
            - name: config
              mountPath: /usr/share/kibana/config/kibana.yml
              subPath: kibana.yml
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 120
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: kibana-config