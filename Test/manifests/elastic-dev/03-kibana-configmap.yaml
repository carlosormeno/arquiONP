apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-config
  namespace: elastic-dev
data:
  kibana.yml: |
    server.name: kibana
    server.host: "0.0.0.0"
    server.publicBaseUrl: "http://172.16.14.189:30560"

    elasticsearch.hosts: ["http://elasticsearch.elastic-dev.svc.cluster.local:9200"]
    elasticsearch.username: "kibana_system"
    elasticsearch.password: "${KIBANA_SYSTEM_PASSWORD}"

    xpack.encryptedSavedObjects.encryptionKey: "${KIBANA_ENCRYPTION_KEY_1}"
    xpack.security.encryptionKey: "${KIBANA_ENCRYPTION_KEY_2}"
    xpack.reporting.encryptionKey: "${KIBANA_ENCRYPTION_KEY_3}"

    logging.root.level: warn